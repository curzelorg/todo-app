# Base44 dev environment for this repo.
# Runs the app from the cloned source (live reload), not from a prebuilt image.
#   start:  docker compose -f docker-compose.base44.yml up -d --build
#   web:    http://localhost:3000
services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      # Passed through from the sandbox; unset outside it and harmless there.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      # Lets Vite accept the preview host (Vite >= 6.1) alongside allowedHosts.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  node_modules:
